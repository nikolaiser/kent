name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@44a942e465867c7465b76aa808ddca6e0acae5da #v7.1.0
        with:
          commitish: main # https://github.com/release-drafter/release-drafter/issues/1125#issuecomment-1471142225
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
